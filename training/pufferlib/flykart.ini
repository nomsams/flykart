[base]
env_name = flykart

[vec]
total_agents = 4096
num_buffers = 4
num_threads = 16

[env]
# 0 = Grand loop, 1 = Switchback, 2 = Zigzag, 3 = sample all layouts
track_set = 3
frameskip = 4
max_ticks = 1500
track_width = 112
lookahead = 86
max_speed = 90
reverse_speed = 48
steer_rate = 0.65
progress_per_second = 12
direction_per_second = 0.45
movement_per_second = 0.12
standing_per_second = 0.55
wrong_direction_per_second = 1.25
reverse_progress_per_second = 1.5
off_track_per_second = 1.1
centerline_per_second = 0.18
collision_penalty = 7
crash_penalty = 25
finish_reward = 250
render = 0

[policy]
hidden_size = 64
num_layers = 2

[train]
total_timesteps = 20000000
learning_rate = 0.0003
gamma = 0.99
gae_lambda = 0.95
replay_ratio = 1.0
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 10
max_grad_norm = 0.5
ent_coef = 0.01
minibatch_size = 16384
horizon = 64
